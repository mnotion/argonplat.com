<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Account</title>

        <script src="js/account.js" defer></script>
    </head>

    <body>

        <a href="Exhibition.html">&lt;-- back</a>


        <nav>
            <button type="button" id="show-login">Login</button>
            <button type="button" id="show-signup">Sign up</button>
        </nav>


        <section id="login-section">
            <h2>Login</h2>

            <form>
                <label for="login-username">Username</label>
                <input id="login-username" type="text" autocomplete="username" required>

                <br><br>

                <label for="login-password">Password</label>
                <input id="login-password" type="password" autocomplete="current-password" required>

                <br><br>

                <button type="submit">Login</button>
                <button type="button" id="recover-password">Recover</button>
            </form>
        </section>


        <section id="signup-section" hidden>
            <h2>Sign up</h2>

            <form>
                <label for="signup-name">Username</label>
                <input id="signup-name" type="text" autocomplete="username" required>

                <br><br>


                <br><br>

                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" autocomplete="new-password" required>

                <br><br>

                <button type="submit">Create account</button>
            </form>
        </section>


    </body>
</html>
