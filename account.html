<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account · Argon</title>
</head>
<body>
    <header>
        <a href="index.html">Argon</a>
        <nav id="account-tabs">
            <button type="button" id="login-tab" aria-controls="login-panel" aria-pressed="true">log in</button>
            <button type="button" id="signup-tab" aria-controls="signup-panel" aria-pressed="false">sign up</button>
        </nav>
    </header>
    <main>
        <section id="login-panel">
            <h1>log in</h1>
            <form id="login-form">
                <label for="login-email">email</label>
                <input id="login-email" name="email" type="email" autocomplete="email" required>
                <br><br>
                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
                <br><br>
                <button type="submit">log in</button>
            </form>
        </section>
        <section id="signup-panel" hidden>
            <h1>sign up</h1>
            <form id="signup-form">
                <label for="signup-username">username</label>
                <input id="signup-username" name="username" type="text" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" title="Use 3–24 letters, numbers or underscores." required>
                <br><br>
                <label for="signup-email">email</label>
                <input id="signup-email" name="email" type="email" autocomplete="email" required>
                <br><br>
                <label for="signup-password">Password</label>
                <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                <br><br>
                <button type="submit">create account</button>
            </form>
        </section>
        <section id="account-panel" hidden>
            <h1>your argon account</h1>
            <p>username: <strong id="profile-username"></strong></p>
            <p>email: <strong id="profile-email"></strong></p>
            <p>plan: <strong id="profile-plan"></strong></p>
            <p>account id: <code id="profile-id"></code></p>
            <p>created: <time id="profile-created"></time></p>
            <button type="button" id="logout-button">log out</button>
        </section>
        <p id="account-message" role="status" aria-live="polite"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth-config.js"></script>
    <script src="js/account.js" defer></script>
</body>
</html>
