<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>My Dashboard — Argon</title>

        <link rel="stylesheet" href="css/style.css">
        <script src="js/main.js" defer></script>
    </head>

    <body class="dashboard-page">

        <header class="exhibition-topbar">
            <a class="exhibition-home" href="Exhibition.html">&lt;-- exhibition</a>
            <h1 class="exhibition-title">My dashboard</h1>
        </header>

        <div class="exhibition-layout">

            <aside class="exhibition-sidebar" aria-label="Dashboard sidebar">
                <div class="sidebar-path-box">
                    click something to show path
                </div>
            </aside>

            <button
                class="sidebar-resize-handle"
                type="button"
                aria-label="Resize sidebar"
                aria-valuemin="180"
                aria-valuemax="360"
            ></button>

            <main class="exhibition-main">
                <section class="exhibition-card-screen" aria-label="Dashboard content">
                    <div class="exhibition-card-grid"></div>
                </section>
            </main>

        </div>

    </body>
</html>
