<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>My Dashboard — Argon</title>

        <link rel="stylesheet" href="css/style.css">
        <script src="js/main.js" defer></script>
    </head>

    <body class="dashboard-page">

        <header class="exhibition-topbar">
            <h1 class="exhibition-title">My dashboard</h1>
        </header>

        <div class="exhibition-layout">

            <aside class="exhibition-sidebar" aria-label="Dashboard sidebar">
                <a class="sidebar-back-button" href="Exhibition.html" aria-label="Back to Exhibition">←</a>
                <div class="sidebar-path-box">
                    click something to show path
                </div>
            </aside>

            <button
                class="sidebar-resize-handle"
                type="button"
                aria-label="Resize sidebar"
                aria-valuemin="180"
                aria-valuemax="360"
            ></button>

            <main class="exhibition-main">
                <section class="exhibition-card-screen" aria-label="Dashboard content">
                    <div class="exhibition-card-grid">
                        <a class="dashboard-exhibition-link" href="my-exhibition.html">My exhibition</a>
                    </div>
                </section>
            </main>

        </div>

    </body>
</html>
