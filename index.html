<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f5f5; font-family: system-ui, sans-serif; }
    .button-field { position: relative; min-height: 100vh; overflow: hidden; }
    .nav-button { position: absolute; padding: 12px 22px; border: 1px solid #222; border-radius: 8px; background: #fff; color: #111; font: inherit; cursor: pointer; box-shadow: 3px 3px 0 #222; transition: transform .15s, box-shadow .15s; }
    .nav-button:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 #222; }
    .nav-button:focus-visible { outline: 3px solid #777; outline-offset: 4px; }
    .login { top: 17%; left: 14%; }
    .forum { top: 32%; right: 18%; }
    .dashboard { top: 61%; left: 35%; }
    .download { bottom: 12%; right: 13%; }
    @media (max-width: 520px) { .login { top: 15%; left: 9%; } .forum { top: 34%; right: 8%; } .dashboard { top: 58%; left: 12%; } .download { bottom: 14%; right: 9%; } }
  </style>
</head>
<body>
  <main class="button-field" aria-label="Navigation">
    <button class="nav-button login" type="button">Login</button>
    <button class="nav-button forum" type="button">Forum</button>
    <button class="nav-button dashboard" type="button">Dashboard</button>
    <button class="nav-button download" type="button">Download</button>
  </main>
</body>
</html>
