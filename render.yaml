services:
  - type: web
    name: argonplat-auth-api
    runtime: python
    region: frankfurt
    branch: development
    rootDir: auth
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://nacwfrsdpglrhzhasmit.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ARGON_ALLOWED_ORIGINS
        sync: false
