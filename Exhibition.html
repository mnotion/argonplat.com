<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Exhibition — Argon</title>

        <link rel="stylesheet" href="css/style.css">
        <script src="js/main.js" defer></script>
    </head>



    <body class="exhibition-page">


        <!-- exhibition heading and local search -->
        <header class="exhibition-topbar">

            <a class="exhibition-home" href="index.html">&lt;-- home</a>

            <h1 class="exhibition-title">Exhibition</h1>

            <div class="exhibition-tools">
                <input type="search" aria-label="Search" placeholder="Search">
            </div>

        </header>


        <!-- content navigation and section grid -->
        <div class="exhibition-layout">

            <aside class="exhibition-sidebar" aria-label="Exhibition sidebar">
                <div class="sidebar-path-box">
                    click something to show path
                </div>
            </aside>


            <!-- sidebar resize control -->
            <button
                class="sidebar-resize-handle"
                type="button"
                aria-label="Resize sidebar"
                aria-valuemin="180"
                aria-valuemax="360"
            ></button>


            <!-- exhibition content -->
            <main class="exhibition-main">

                <section class="exhibition-card-screen" aria-label="Exhibition sections">

                    <div class="exhibition-card-grid">

                        <!-- content section -->
                        <section class="exhibition-section">
                            <h2>Content</h2>

                            <a href="#">a-level</a>
                            <a href="#">flashcards</a>
                        </section>


                        <!-- resources section -->
                        <section class="exhibition-section">
                            <h2>Resources</h2>

                            <a href="#">a-level</a>
                            <a href="#">.agn's</a>
                        </section>


                        <!-- community section -->
                        <section class="exhibition-section">
                            <h2>Community</h2>

                            <a href="#">resources</a>
                            <a href="#">content</a>
                        </section>


                        <!-- personal section -->
                        <a class="exhibition-section dashboard-card" href="dashboard.html" aria-label="Open My Dashboard">
                            <h2>My dashboard</h2>

                            <p>Personal repositories are not available in this offline-only version.</p>
                        </a>

                    </div>
                </section>
            </main>

        </div>


    </body>
</html>
