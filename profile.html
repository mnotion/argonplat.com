<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile · Argon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <table class="navigation" width="100%">
        <tr>
            <td align="left">
                <a href="index.html" style="color:inherit;text-decoration:none">Argon</a>&nbsp;&nbsp;
                Profile&nbsp;&nbsp;
                Search
            </td>
            <td align="right">
                <a href="download.html">Download</a>&nbsp;&nbsp;
                <a href="Exhibition.html">Exhibition</a>&nbsp;&nbsp;
                Wiki&nbsp;&nbsp;
                Forum
            </td>
        </tr>
    </table>

    <main>
        <section>
            <nav aria-label="Account options">
                <button type="button" id="login-tab" aria-controls="login-panel" aria-pressed="true">Log in</button>
                <button type="button" id="signup-tab" aria-controls="signup-panel" aria-pressed="false">Sign up</button>
            </nav>

            <div id="login-panel">
                <h1>Log in</h1>
                <p>Access your Argon profile.</p>
                <form action="#" method="post">
                    <label for="login-username">Username or email
                        <input id="login-username" name="username" type="text" autocomplete="username" required>
                    </label>
                    <br><br>
                    <label for="login-password">Password
                        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                    </label>
                    <br><br>
                    <button type="submit">Log in</button>
                </form>
            </div>

            <div id="signup-panel" hidden>
                <h1>Sign up</h1>
                <p>Create an Argon profile.</p>
                <form action="#" method="post">
                    <label for="signup-username">Username
                        <input id="signup-username" name="username" type="text" autocomplete="username" required>
                    </label>
                    <br><br>
                    <label for="signup-email">Email
                        <input id="signup-email" name="email" type="email" autocomplete="email" required>
                    </label>
                    <br><br>
                    <label for="signup-password">Password
                        <input id="signup-password" name="password" type="password" autocomplete="new-password" required>
                    </label>
                    <br><br>
                    <button type="submit">Create account</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        const loginTab = document.getElementById('login-tab');
        const signupTab = document.getElementById('signup-tab');
        const loginPanel = document.getElementById('login-panel');
        const signupPanel = document.getElementById('signup-panel');

        loginTab.addEventListener('click', () => {
            loginPanel.hidden = false;
            signupPanel.hidden = true;
            loginTab.setAttribute('aria-pressed', 'true');
            signupTab.setAttribute('aria-pressed', 'false');
        });

        signupTab.addEventListener('click', () => {
            loginPanel.hidden = true;
            signupPanel.hidden = false;
            loginTab.setAttribute('aria-pressed', 'false');
            signupTab.setAttribute('aria-pressed', 'true');
        });
    </script>
</body>
</html>
